# Perfil de tests: H2 en memoria, sin tocar Postgres
spring.datasource.url=jdbc:h2:mem:hormigas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-test-secret-test-secret-test-secret-1234567890
jwt.expiration=86400000

app.bootstrap.admin.email=root@test.local
app.bootstrap.admin.password=Root12345!
app.bootstrap.admin.nombre=Root Test
